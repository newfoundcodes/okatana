services:
  web:
    environment:
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: okatana
      DB_USERNAME: okatana
      DB_PASSWORD: ${OKATANA_DB_PASSWORD:-change-me}
    depends_on:
      database:
        condition: service_healthy
  queue:
    environment:
      DB_CONNECTION: mysql
      DB_HOST: database
      DB_PORT: 3306
      DB_DATABASE: okatana
      DB_USERNAME: okatana
      DB_PASSWORD: ${OKATANA_DB_PASSWORD:-change-me}
    depends_on:
      database:
        condition: service_healthy
  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: okatana
      MYSQL_USER: okatana
      MYSQL_PASSWORD: ${OKATANA_DB_PASSWORD:-change-me}
      MYSQL_ROOT_PASSWORD: ${OKATANA_DB_ROOT_PASSWORD:-change-root-me}
    volumes:
      - okatana_mysql:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          '127.0.0.1',
          '-uroot',
          '-p${OKATANA_DB_ROOT_PASSWORD:-change-root-me}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
volumes:
  okatana_mysql:
